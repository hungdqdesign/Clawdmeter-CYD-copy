[env:cyd_28]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
board_build.partitions = huge_app.csv

build_src_filter =
    +<*>
    -<diag_main.cpp>
    -<boards/>
    +<boards/cyd_28/>

build_flags =
    -DBOARD_CYD_28
    ; CYD uses CP2102 USB-serial — no USB CDC on boot.
    ; NimBLE: 1 connection (display-only, no HID keyboard service).
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; ---- TFT_eSPI panel config (single source of truth) ----
    ; This board is the 3.5" S035 (ST7796, 320x480, backlight GPIO27).
    ; Config is passed via build flags + USER_SETUP_LOADED so TFT_eSPI can
    ; NEVER silently fall back to its bundled default User_Setup.h (the old
    ; lib_extra_dirs approach did not reliably override the include, which
    ; left the library on wrong default pins → black screen).
    -DUSER_SETUP_LOADED
    -DST7796_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTFT_RGB_ORDER=TFT_BGR
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    ; Resistive touch (XPT2046) shares this SPI bus on the S035 — TFT_eSPI
    ; reads it via TOUCH_CS. (The 2.8" CYD uses a separate HSPI bus; not here.)
    -DTOUCH_CS=33
    -DSPI_TOUCH_FREQUENCY=2500000
    ; Byte order is handled by tft.setSwapBytes(true) in display.cpp (the
    ; canonical TFT_eSPI + LVGL pairing), so LVGL renders native-endian and
    ; LV_COLOR_16_SWAP stays off.
    ; No PSRAM — use internal SRAM, shrink render buffers.
    ; BUF_LINES=13 and MALLOC_CAP_INTERNAL are selected automatically
    ; in main.cpp when BOARD_HAS_PSRAM is absent.
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1
    -DLV_USE_SNAPSHOT=0

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen#f956c5d8ce3bf39169c7378416b89e7cfe70a034
    lvgl/lvgl@9.5.0
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@2.5.0



; Touch calibration tool, see README.
